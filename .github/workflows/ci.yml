name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . || pip install pytest
      - name: Byte-compile (fail fast on syntax errors)
        run: python -m compileall trackblock tests
      - name: Test
        shell: bash
        run: |
          if compgen -G "tests/*.py" > /dev/null; then
            python -m pytest -q
          else
            echo "no tests present — skipping"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (correctness rules)
        # Scope to the high-signal correctness set (pyflakes + syntax) so the
        # gate catches real bugs without failing on stylistic preferences.
        run: ruff check --select E9,F63,F7,F82 trackblock tests
