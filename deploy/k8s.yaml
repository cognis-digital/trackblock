apiVersion: apps/v1
kind: Deployment
metadata: { name: trackblock, labels: { app: trackblock } }
spec:
  replicas: 1
  selector: { matchLabels: { app: trackblock } }
  template:
    metadata: { labels: { app: trackblock } }
    spec:
      containers:
        - name: trackblock
          image: ghcr.io/cognis-digital/trackblock:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: trackblock }
spec:
  selector: { app: trackblock }
  ports: [{ port: 80, targetPort: 8000 }]
